<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raygun Apartment Booking</title>
<style>
 body{font-family:Arial,sans-serif;max-width:480px;margin:20px auto;padding:0 12px}
 h2,h3{color:#17365D} input,select,button{width:100%;padding:9px;margin-top:8px;box-sizing:border-box}
 button{background:#17365D;color:#fff;border:0;cursor:pointer}
 #days{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
 .day{background:#D9EAD3;color:#000;border:2px solid transparent}
 .day.sel{border-color:#17365D;font-weight:bold}
 .day:disabled{background:#eee;color:#999;text-decoration:line-through;cursor:not-allowed}
 #msg{margin-top:14px;font-weight:bold}
</style></head><body>
<h2>Raygun Service Apartment</h2>

<h3>Book a stay</h3>
<select id="loc"><option value="">Select location…</option></select>
<div id="days">Select a location to see available dates.</div>
<input id="name" placeholder="Full name">
<input id="email" type="email" placeholder="Email">
<button onclick="book()">Confirm booking</button>

<h3>Cancel a booking</h3>
<input id="cref" placeholder="Booking reference">
<input id="cemail" type="email" placeholder="Your email">
<button onclick="cancel()">Cancel booking</button>
<div id="msg"></div>

<script>
const API = 'PASTE_YOUR_EXEC_URL_HERE';   // public /macros/s/.../exec link
let chosen = '';
const $ = id => document.getElementById(id);
const say = (t, ok) => { $('msg').textContent = t; $('msg').style.color = ok === undefined ? '#333' : ok ? 'green' : 'red'; };
const FAIL = 'Could not reach the booking server. Check the API link and that access is set to Anyone.';

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  return await r.json();            // throws if Google returns a sign-in/error page
}

async function init() {
  try {
    const r = await getJSON(API);
    r.locations.forEach(l => $('loc').add(new Option(l, l)));
  } catch (e) { say(FAIL, false); }
}

async function loadDays() {
  chosen = '';
  if (!$('loc').value) { $('days').textContent = 'Select a location to see available dates.'; return; }
  $('days').textContent = 'Loading…';
  try {
    const r = await getJSON(API + '?location=' + encodeURIComponent($('loc').value));
    $('days').innerHTML = '';
    r.days.forEach(d => {
      const b = document.createElement('button');
      b.className = 'day'; b.disabled = !d.available;
      b.textContent = new Date(d.date + 'T00:00').toDateString();
      b.onclick = () => {
        chosen = d.date;
        document.querySelectorAll('.day').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
      };
      $('days').appendChild(b);
    });
  } catch (e) { $('days').textContent = ''; say(FAIL, false); }
}
$('loc').onchange = loadDays;

async function send(payload) {
  say('Processing…');
  try {
    const r = await getJSON(API, {method: 'POST', body: JSON.stringify(payload)});
    say(r.message, r.ok);
    if (r.ok) loadDays();
  } catch (e) { say(FAIL, false); }
}
function book() {
  if (!$('loc').value) return say('Select a location first.', false);
  if (!chosen) return say('Select a date first.', false);
  send({action:'book', location:$('loc').value, date:chosen, name:$('name').value, email:$('email').value});
}
function cancel() {
  send({action:'cancel', ref:$('cref').value, email:$('cemail').value});
  setTimeout(loadDays, 2500);
}
init();
</script></body></html>
