<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raygun Apartment Booking</title>
<style>
 body{font-family:Arial,sans-serif;max-width:480px;margin:20px auto;padding:0 12px}
 h2,h3{color:#17365D} input,select,button{width:100%;padding:9px;margin-top:8px;box-sizing:border-box}
 button{background:#17365D;color:#fff;border:0;cursor:pointer}
 button:disabled{opacity:.6;cursor:not-allowed}
 .brand{text-align:center;padding:6px 0 0}
 .brand img.logo{height:64px;max-width:80%}
 .hero{width:100%;border-radius:10px;margin:12px 0 4px;display:block}
 .tag{text-align:center;color:#0D4E76;margin:6px 0 0;font-size:14px}
 #days{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
 .day{background:#D9EAD3;color:#000;border:2px solid transparent}
 .day.sel{background:#17365D;color:#fff;font-weight:bold}
 .day:disabled{background:#eee;color:#999;text-decoration:line-through}
 #msg{margin-top:14px;font-weight:bold}
</style></head><body>

<div class="brand"><img class="logo" src="logo.png" alt="Raygun Security & Investigations"></div>
<img class="hero" src="apartment-sketch.png" alt="Raygun service apartment sketch">
<p class="tag">Pick your house, choose your nights, and your confirmation arrives by email.</p>

<h3>Book a stay</h3>
<select id="loc"><option value="">Select location…</option></select>
<p style="margin:8px 0 0;color:#555">Tap one or more dates (tap again to unselect).</p>
<div id="days">Select a location to see available dates.</div>
<input id="name" placeholder="Full name">
<input id="email" type="email" placeholder="Email">
<button id="bk" onclick="book()">Confirm booking</button>

<h3>Cancel a booking</h3>
<input id="cref" placeholder="Booking reference">
<input id="cemail" type="email" placeholder="Your email">
<button onclick="cancel()">Cancel booking</button>
<div id="msg"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxH2WeKG02DxwjBogFcsSerRkjOrmZGAgj_5d3giTm2En_-LZ2N1k91NN8BZa1__1hcMQ/exec';
const chosen = new Set();
const $ = id => document.getElementById(id);
const say = (t, ok) => { $('msg').textContent = t; $('msg').style.color = ok === undefined ? '#333' : ok ? 'green' : 'red'; };
const FAIL = 'Could not reach the booking server. Check the API link and that access is set to Anyone.';
const label = () => { $('bk').textContent = chosen.size ? 'Confirm booking (' + chosen.size + ' night' + (chosen.size > 1 ? 's' : '') + ')' : 'Confirm booking'; };

async function getJSON(url, opts) { return await (await fetch(url, opts)).json(); }

async function init() {
  try { (await getJSON(API)).locations.forEach(l => $('loc').add(new Option(l, l))); }
  catch (e) { say(FAIL, false); }
}

async function loadDays() {
  chosen.clear(); label();
  if (!$('loc').value) { $('days').textContent = 'Select a location to see available dates.'; return; }
  $('days').textContent = 'Loading…';
  try {
    const r = await getJSON(API + '?location=' + encodeURIComponent($('loc').value) + '&t=' + Date.now());
    $('days').innerHTML = '';
    r.days.forEach(d => {
      const b = document.createElement('button');
      b.className = 'day'; b.disabled = !d.available;
      b.textContent = new Date(d.date + 'T00:00').toDateString();
      b.onclick = () => {
        if (chosen.has(d.date)) { chosen.delete(d.date); b.classList.remove('sel'); }
        else { chosen.add(d.date); b.classList.add('sel'); }
        label();
      };
      $('days').appendChild(b);
    });
  } catch (e) { $('days').textContent = ''; say(FAIL, false); }
}
$('loc').onchange = loadDays;

async function send(payload) {
  say('Processing…'); $('bk').disabled = true;
  try {
    const r = await getJSON(API, {method: 'POST', body: JSON.stringify(payload)});
    say(r.message, r.ok);
    if (r.ok) loadDays();
  } catch (e) { say(FAIL, false); }
  $('bk').disabled = false;
}
function book() {
  if (!$('loc').value) return say('Select a location first.', false);
  if (!chosen.size) return say('Select at least one date.', false);
  send({action:'book', location:$('loc').value, dates:[...chosen].sort(), name:$('name').value, email:$('email').value});
}
async function cancel() {
  await send({action:'cancel', ref:$('cref').value, email:$('cemail').value});
  loadDays();
}
init();
</script></body></html>
